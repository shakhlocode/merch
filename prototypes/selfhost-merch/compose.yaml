name: merch-selfhost-demo
x-logging: &bounded-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
services:
  db:
    logging: *bounded-logging
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: merch_selfhost_demo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DEMO_DB_ADMIN_PASSWORD:?Run npm run init}
      DEMO_DB_PASSWORD: ${DEMO_DB_PASSWORD:?Run npm run init}
      DEMO_MIGRATOR_PASSWORD: ${DEMO_MIGRATOR_PASSWORD:?Run npm run init}
      DEMO_RETENTION_PASSWORD: ${DEMO_RETENTION_PASSWORD:?Run npm run init}
    volumes:
      - database:/var/lib/postgresql/data
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/01-app-role.sh:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d merch_selfhost_demo"]
      interval: 3s
      timeout: 3s
      retries: 30
    networks: [isolated]
  keycloak:
    logging: *bounded-logging
    image: quay.io/keycloak/keycloak:26.4.2
    command: [start-dev, --import-realm, --hostname=http://127.0.0.1:8280]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: demo-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${DEMO_KC_ADMIN_PASSWORD:?Run npm run init}
      JAVA_OPTS_KC_HEAP: -Xms128m -Xmx512m
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      NO_PROXY: "*"
      no_proxy: "*"
    volumes:
      - ./.local/realm.json:/opt/keycloak/data/import/realm.json:ro
      - identity-provider:/opt/keycloak/data
    networks: [isolated]
  setup:
    logging: *bounded-logging
    build: .
    user: "0"
    command: [node, migrate.mjs]
    environment:
      DEMO_MIGRATOR_PASSWORD: ${DEMO_MIGRATOR_PASSWORD:?Run npm run init}
      DEMO_GUEST_TOKEN: ${DEMO_GUEST_TOKEN:?Run npm run init}
      DEMO_SESSION_PEPPER: ${DEMO_SESSION_PEPPER:?Run npm run init}
      DEMO_DATA_KEY: ${DEMO_DATA_KEY:?Run npm run init}
    depends_on:
      db: {condition: service_healthy}
    volumes:
      - product-files:/data/files
      - deletion-ledger:/data/ledger
    networks: [isolated]
  retention:
    logging: *bounded-logging
    build: .
    command: [node, worker.mjs]
    environment:
      DEMO_RETENTION_PASSWORD: ${DEMO_RETENTION_PASSWORD:?Run npm run init}
      DEMO_LIFECYCLE_KEY: ${DEMO_LIFECYCLE_KEY:?Run npm run init}
    depends_on:
      setup: {condition: service_completed_successfully}
    volumes:
      - deletion-ledger:/data/ledger
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:9050/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 30
    networks: [isolated]
  app:
    logging: *bounded-logging
    build: .
    environment:
      DEMO_LIFECYCLE_KEY: ${DEMO_LIFECYCLE_KEY:?Run npm run init}
      DEMO_ONLY: "true"
      DEMO_BASE_URL: http://127.0.0.1:3280
      DEMO_ISSUER: http://127.0.0.1:8280/realms/merch-storage-demo
      DEMO_IDP_INTERNAL_ORIGIN: http://keycloak:8080
      DEMO_CLIENT_ID: merch-storage-review
      DEMO_CLIENT_SECRET: ${DEMO_CLIENT_SECRET:?Run npm run init}
      DEMO_DB_PASSWORD: ${DEMO_DB_PASSWORD:?Run npm run init}
      DEMO_GUEST_TOKEN: ${DEMO_GUEST_TOKEN:?Run npm run init}
      DEMO_SESSION_PEPPER: ${DEMO_SESSION_PEPPER:?Run npm run init}
      DEMO_DATA_KEY: ${DEMO_DATA_KEY:?Run npm run init}
    depends_on:
      retention: {condition: service_healthy}
    volumes:
      - product-files:/data/files:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [isolated]
networks:
  isolated:
    internal: true
volumes:
  database:
  identity-provider:
  product-files:
  deletion-ledger:
